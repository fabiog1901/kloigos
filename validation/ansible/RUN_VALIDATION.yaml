# Controller orchestration. Linux commands run in Ansible; run.py only evaluates evidence.
- name: Run Kloigos validation on explicitly selected test hosts
  hosts: validation_hosts
  gather_facts: false
  become: true
  vars:
    validation_remote_root: "/var/lib/kloigos-validation/runs/{{ validation_run_id }}"
    validation_remote_report: "{{ validation_remote_root }}/report.json"
    validation_remote_evidence: "{{ validation_remote_root }}/evidence.json"
  tasks:

    - name: Validate stable check group
      ansible.builtin.assert:
        that: validation_group in ['smoke', 'resources', 'network', 'workloads']
        fail_msg: "KLOIGOS_VALIDATION_GROUP must be smoke, resources, network, or workloads."

    - name: Require destructive-workload consent
      ansible.builtin.assert:
        that: validation_allow_destructive | bool
        fail_msg: "The workloads group requires KLOIGOS_VALIDATION_ALLOW_DESTRUCTIVE=1."
      when: validation_group == 'workloads'

    - name: Create remote run workspace
      ansible.builtin.file:
        path: "{{ validation_remote_root }}"
        state: directory
        mode: "0750"

    - name: Deploy report evaluator
      ansible.builtin.copy:
        src: ../runner/run.py
        dest: "{{ validation_remote_root }}/run.py"
        mode: "0750"

    - name: Smoke | discover Compute Unit LVM volumes
      shell: |
        lvs --noheadings -o lv_name | grep -Eq '^[[:space:]]*cu[0-9]+$'
      args: {executable: /bin/bash}
      register: smoke_compute_units_discovery
      changed_when: false
      failed_when: false
      when: validation_group == 'smoke'

    - name: Smoke | check cgroup v2 and systemd delegation
      shell: |
        test -f /sys/fs/cgroup/cgroup.controllers && grep -qw cpuset /sys/fs/cgroup/cgroup.controllers && test -f /etc/systemd/system/user@.service.d/delegate.conf
      args: {executable: /bin/bash}
      register: smoke_cgroups_v2
      changed_when: false
      failed_when: false
      when: validation_group == 'smoke'

    - name: Smoke | check allocated-user slice CPU configuration
      shell: |
        if compgen -G '/etc/systemd/system/user-*.slice.d/50-kloigos.conf' >/dev/null;
        then grep -Rqs '^AllowedCPUs=' /etc/systemd/system/user-*.slice.d/50-kloigos.conf;
        else printf '__KLOIGOS_SKIPPED__\n'; fi
      args: {executable: /bin/bash}
      register: smoke_cpu_cpuset
      changed_when: false
      failed_when: false
      when: validation_group == 'smoke'

    - name: Smoke | confirm systemd manager is available
      ansible.builtin.command: systemctl show --property=Version --value
      register: smoke_systemd_manager
      changed_when: false
      failed_when: false
      when: validation_group == 'smoke'

    - name: Smoke | discover Compute Unit mount directories
      shell: |
        find /mnt/kloigos -mindepth 2 -maxdepth 2 -type d -name 'cu*' -print -quit | grep -q .
      args: {executable: /bin/bash}
      register: smoke_storage_compute_unit_mounts
      changed_when: false
      failed_when: false
      when: validation_group == 'smoke'

    - name: Smoke | check configured floating-IP definitions
      shell: |
        if compgen -G '/etc/kloigos/floating-ips.d/*.conf' >/dev/null;
        then grep -Rqs '^ip_address=' /etc/kloigos/floating-ips.d;
        else printf '__KLOIGOS_SKIPPED__\n'; fi
      args: {executable: /bin/bash}
      register: smoke_networking_floating_ips
      changed_when: false
      failed_when: false
      when: validation_group == 'smoke'

    - name: Smoke | verify Kloigos nftables configuration
      shell: |
        test -f /etc/nftables.conf && test -f /etc/nftables.d/kloigos-compute-units.nft && nft list table inet kloigos_compute_units
      args: {executable: /bin/bash}
      register: smoke_nftables_configuration
      changed_when: false
      failed_when: false
      when: validation_group == 'smoke'

    - name: Smoke | check Kloigos AppArmor profiles
      shell: |
        if compgen -G '/etc/apparmor.d/kloigos-*' >/dev/null;
        then aa-status --enabled;
        else printf '__KLOIGOS_SKIPPED__\n'; fi
      args: {executable: /bin/bash}
      register: smoke_apparmor_profiles
      changed_when: false
      failed_when: false
      when: validation_group == 'smoke'

    - name: Smoke | check rendered allocation file-descriptor limits
      shell: |
        if compgen -G '/etc/systemd/system/user@*.service.d/50-kloigos.conf' >/dev/null;
        then grep -Rqs '^LimitNOFILE=[0-9]' /etc/systemd/system/user@*.service.d/50-kloigos.conf;
        else printf '__KLOIGOS_SKIPPED__\n'; fi
      args: {executable: /bin/bash}
      register: smoke_resource_limits_nofile
      changed_when: false
      failed_when: false
      when: validation_group == 'smoke'

    - name: Smoke | write collected evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'compute-units.discovery', 'command': smoke_compute_units_discovery.cmd, 'stdout': smoke_compute_units_discovery.stdout, 'stderr': smoke_compute_units_discovery.stderr, 'rc': smoke_compute_units_discovery.rc},
          {'id': 'cgroups.v2', 'command': smoke_cgroups_v2.cmd, 'stdout': smoke_cgroups_v2.stdout, 'stderr': smoke_cgroups_v2.stderr, 'rc': smoke_cgroups_v2.rc},
          {'id': 'cpu.cpuset', 'status': 'skipped', 'summary': 'No allocated-user slice overrides are present on this host.'} if smoke_cpu_cpuset.stdout == '__KLOIGOS_SKIPPED__' else {'id': 'cpu.cpuset', 'command': smoke_cpu_cpuset.cmd, 'stdout': smoke_cpu_cpuset.stdout, 'stderr': smoke_cpu_cpuset.stderr, 'rc': smoke_cpu_cpuset.rc},
          {'id': 'systemd.manager', 'command': smoke_systemd_manager.cmd, 'stdout': smoke_systemd_manager.stdout, 'stderr': smoke_systemd_manager.stderr, 'rc': smoke_systemd_manager.rc},
          {'id': 'storage.compute-unit-mounts', 'command': smoke_storage_compute_unit_mounts.cmd, 'stdout': smoke_storage_compute_unit_mounts.stdout, 'stderr': smoke_storage_compute_unit_mounts.stderr, 'rc': smoke_storage_compute_unit_mounts.rc},
          {'id': 'networking.floating-ips', 'status': 'skipped', 'summary': 'No Kloigos floating-IP configurations are present.'} if smoke_networking_floating_ips.stdout == '__KLOIGOS_SKIPPED__' else {'id': 'networking.floating-ips', 'command': smoke_networking_floating_ips.cmd, 'stdout': smoke_networking_floating_ips.stdout, 'stderr': smoke_networking_floating_ips.stderr, 'rc': smoke_networking_floating_ips.rc},
          {'id': 'nftables.configuration', 'command': smoke_nftables_configuration.cmd, 'stdout': smoke_nftables_configuration.stdout, 'stderr': smoke_nftables_configuration.stderr, 'rc': smoke_nftables_configuration.rc},
          {'id': 'apparmor.profiles', 'status': 'skipped', 'summary': 'No Kloigos AppArmor profiles are present.'} if smoke_apparmor_profiles.stdout == '__KLOIGOS_SKIPPED__' else {'id': 'apparmor.profiles', 'command': smoke_apparmor_profiles.cmd, 'stdout': smoke_apparmor_profiles.stdout, 'stderr': smoke_apparmor_profiles.stderr, 'rc': smoke_apparmor_profiles.rc},
          {'id': 'resource-limits.nofile', 'status': 'skipped', 'summary': 'No allocation LimitNOFILE overrides are present.'} if smoke_resource_limits_nofile.stdout == '__KLOIGOS_SKIPPED__' else {'id': 'resource-limits.nofile', 'command': smoke_resource_limits_nofile.cmd, 'stdout': smoke_resource_limits_nofile.stdout, 'stderr': smoke_resource_limits_nofile.stderr, 'rc': smoke_resource_limits_nofile.rc}
          ] | to_nice_json }}
        dest: "{{ validation_remote_evidence }}"
        mode: "0640"
      when: validation_group == 'smoke'

    - name: Resources | inspect selected allocation cgroup limits
      shell: |
        uid=$(id -u {{ validation_fixture.login_user | default('') | quote }}) &&
        cgroup=/sys/fs/cgroup/user.slice/user-${uid}.slice &&
        test -s "$cgroup/cpuset.cpus.effective" &&
        test "$(cat "$cgroup/memory.max")" != max &&
        test "$(cat "$cgroup/pids.max")" != max
      args:
        executable: /bin/bash
      register: resources_cgroup_limits
      changed_when: false
      failed_when: false
      when: validation_group == 'resources'

    - name: Network | verify selected fixture floating IP is present
      ansible.builtin.command:
        argv: [ip, addr, show, to, "{{ validation_fixture.ip_address | default('') }}"]
      register: network_floating_ip
      changed_when: false
      failed_when: false
      when: validation_group == 'network'

    - name: Network | verify Kloigos nftables table is active
      ansible.builtin.command:
        argv: [nft, list, table, inet, kloigos_compute_units]
      register: network_nftables
      changed_when: false
      failed_when: false
      when: validation_group == 'network'

    - name: Network | write collected evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'network.floating-ip', 'command': network_floating_ip.cmd,
          'stdout': network_floating_ip.stdout, 'stderr': network_floating_ip.stderr,
          'rc': network_floating_ip.rc},
          {'id': 'network.nftables', 'command': network_nftables.cmd,
          'stdout': network_nftables.stdout, 'stderr': network_nftables.stderr,
          'rc': network_nftables.rc}
          ] | to_nice_json }}
        dest: "{{ validation_remote_evidence }}"
        mode: "0640"
      when: validation_group == 'network'

    - name: Resources | verify selected allocation cgroup hierarchy
      shell: |
        uid=$(id -u {{ validation_fixture.login_user | default('') | quote }}) &&
        test -d "/sys/fs/cgroup/user.slice/user-${uid}.slice"
      args:
        executable: /bin/bash
      register: resources_cgroup_hierarchy
      changed_when: false
      failed_when: false
      when: validation_group == 'resources'

    - name: Resources | inspect selected allocation CPU affinity
      ansible.builtin.command:
        argv: [runuser, -u, "{{ validation_fixture.login_user | default('') }}", --, taskset, -pc, "0"]
      register: resources_cpu_affinity_positive
      changed_when: false
      failed_when: false
      when: validation_group == 'resources'

    - name: Resources | verify allocation CPU-affinity escape is denied
      shell: |
        uid=$(id -u {{ validation_fixture.login_user | default('') | quote }}) &&
        allowed=$(cat "/sys/fs/cgroup/user.slice/user-${uid}.slice/cpuset.cpus.effective") &&
        outside=$(python3 -c 'import os,sys; allowed=set(); [allowed.update(range(int(x.split("-")[0]), int(x.split("-")[-1])+1)) for x in sys.argv[1].split(",") if x]; print(next((cpu for cpu in range(os.cpu_count() or 0) if cpu not in allowed), ""))' "$allowed") &&
        test -n "$outside" && runuser -u {{ validation_fixture.login_user | default('') | quote }} -- taskset -c "$outside" /bin/true
      args:
        executable: /bin/bash
      register: resources_cpu_affinity_escape
      changed_when: false
      failed_when: false
      when: validation_group == 'resources'

    - name: Resources | verify Kloigos systemd overrides are rendered
      shell: |
        find /etc/systemd/system -path '*/50-kloigos.conf' -print -quit | grep -q .
      args:
        executable: /bin/bash
      register: resources_systemd_overrides
      changed_when: false
      failed_when: false
      when: validation_group == 'resources'

    - name: Resources | write cgroup-limit evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'resources.cgroup-hierarchy', 'command': resources_cgroup_hierarchy.cmd,
          'stdout': resources_cgroup_hierarchy.stdout, 'stderr': resources_cgroup_hierarchy.stderr,
          'rc': resources_cgroup_hierarchy.rc},
          {'id': 'resources.cgroup-limits', 'command': resources_cgroup_limits.cmd,
          'stdout': resources_cgroup_limits.stdout, 'stderr': resources_cgroup_limits.stderr,
          'rc': resources_cgroup_limits.rc}
          , {'id': 'resources.cpu-affinity.positive', 'command': resources_cpu_affinity_positive.cmd,
          'stdout': resources_cpu_affinity_positive.stdout, 'stderr': resources_cpu_affinity_positive.stderr,
          'rc': resources_cpu_affinity_positive.rc}
          , {'id': 'resources.cpu-affinity.escape', 'command': resources_cpu_affinity_escape.cmd,
          'stdout': resources_cpu_affinity_escape.stdout, 'stderr': resources_cpu_affinity_escape.stderr,
          'rc': resources_cpu_affinity_escape.rc, 'expect_failure': true}
          , {'id': 'resources.systemd-overrides', 'command': resources_systemd_overrides.cmd,
          'stdout': resources_systemd_overrides.stdout, 'stderr': resources_systemd_overrides.stderr,
          'rc': resources_systemd_overrides.rc}
          ] | to_nice_json }}
        dest: "{{ validation_remote_evidence }}"
        mode: "0640"
      when: validation_group == 'resources'

    - name: Workloads | verify selected fixture user exists
      ansible.builtin.command:
        argv: [id, -u, "{{ validation_fixture.login_user | default('') }}"]
      register: workloads_fixture_user
      changed_when: false
      failed_when: false
      when: validation_group == 'workloads'

    - name: Workloads | run bounded stress-ng workload
      ansible.builtin.command:
        argv: [runuser, -u, "{{ validation_fixture.login_user | default('') }}", --, stress-ng, --cpu, "1", --vm, "1", --vm-bytes, 64M, --fork, "1", --hdd, "1", --hdd-bytes, 16M, --timeout, 15s, --metrics-brief]
      register: workloads_stress_ng
      changed_when: false
      failed_when: false
      when: validation_group == 'workloads' and workloads_fixture_user.rc == 0

    - name: Workloads | run and clean bounded fio workload
      shell: |
        fio --name=kloigos-validation --filename=/var/lib/kloigos-validation/.fio.bin --size=16M --rw=readwrite --bs=1M --direct=0 --verify=crc32c --do_verify=1 --output-format=json
        rc=$?
        rm -f /var/lib/kloigos-validation/.fio.bin
        exit $rc
      args:
        executable: /bin/bash
      register: workloads_fio
      changed_when: false
      failed_when: false
      when: validation_group == 'workloads'

    - name: Workloads | verify host responsiveness
      ansible.builtin.command:
        argv: [systemctl, is-system-running]
      register: workloads_host_responsiveness
      changed_when: false
      failed_when: false
      when: validation_group == 'workloads'

    - name: Workloads | write collected evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'workloads.fixture-user', 'command': workloads_fixture_user.cmd, 'stdout': workloads_fixture_user.stdout, 'stderr': workloads_fixture_user.stderr, 'rc': workloads_fixture_user.rc},
          {'id': 'workloads.stress-ng', 'command': workloads_stress_ng.cmd | default('not run'), 'stdout': workloads_stress_ng.stdout | default(''), 'stderr': workloads_stress_ng.stderr | default('fixture user is unavailable'), 'rc': workloads_stress_ng.rc | default(1)},
          {'id': 'workloads.fio', 'command': workloads_fio.cmd, 'stdout': workloads_fio.stdout, 'stderr': workloads_fio.stderr, 'rc': workloads_fio.rc},
          {'id': 'workloads.host-responsiveness', 'command': workloads_host_responsiveness.cmd, 'stdout': workloads_host_responsiveness.stdout, 'stderr': workloads_host_responsiveness.stderr, 'rc': workloads_host_responsiveness.rc}
          ] | to_nice_json }}
        dest: "{{ validation_remote_evidence }}"
        mode: "0640"
      when: validation_group == 'workloads'

    - name: Evaluate collected evidence and write report
      ansible.builtin.command:
        argv:
          [
            python3,
            "{{ validation_remote_root }}/run.py",
            --group,
            "{{ validation_group }}",
            --target,
            "{{ inventory_hostname }}",
            --evidence-file,
            "{{ validation_remote_evidence }}",
            --output,
            "{{ validation_remote_report }}",
            --allow-destructive,
          ]
      register: validation_runner
      changed_when: false
      failed_when: false

    - name: Fetch validation report and evidence
      ansible.builtin.fetch:
        src: "{{ item }}"
        dest: "{{ validation_controller_report_dir }}/"
        flat: false
      loop:
        ["{{ validation_remote_report }}", "{{ validation_remote_evidence }}"]
      failed_when: false

    - name: Archive raw command artifacts
      ansible.builtin.command:
        argv:
          [
            tar,
            -C,
            "{{ validation_remote_root }}",
            -czf,
            "{{ validation_remote_root }}/artifacts.tar.gz",
            --exclude=report.json,
            --exclude=evidence.json,
            .,
          ]
      changed_when: false
      failed_when: false

    - name: Fetch raw command artifacts
      ansible.builtin.fetch:
        src: "{{ validation_remote_root }}/artifacts.tar.gz"
        dest: "{{ validation_controller_report_dir }}/"
        flat: false
      failed_when: false

    - name: Remove successful remote workspace
      ansible.builtin.file:
        path: "{{ validation_remote_root }}"
        state: absent
      when: validation_runner.rc | default(1) == 0

    - name: Propagate validation result
      ansible.builtin.assert:
        that: validation_runner.rc == 0
        fail_msg: "Validation failed on {{ inventory_hostname }}; inspect the fetched JSON report."
