# Controller orchestration. Linux commands run in Ansible; the local controller evaluates bundles.
- name: Run Kloigos validation on explicitly selected test hosts
  hosts: validation_hosts
  gather_facts: false
  become: true
  vars:
    validation_remote_root: "/var/lib/kloigos-validation/runs/{{ validation_run_id }}"
    validation_remote_evidence_dir: "{{ validation_remote_root }}/evidence"
    validation_remote_bundle: "{{ validation_remote_root }}.tar.gz"
  tasks:

    - name: Validate stable check group
      ansible.builtin.assert:
        that: validation_group in ['all', 'smoke', 'resources', 'network', 'workloads']
        fail_msg: "KLOIGOS_VALIDATION_GROUP must be all, smoke, resources, network, or workloads."

    - name: Require destructive-workload consent
      ansible.builtin.assert:
        that: validation_allow_destructive | bool
        fail_msg: "The workloads group requires KLOIGOS_VALIDATION_ALLOW_DESTRUCTIVE=1."
      when: validation_group in ['workloads', 'all']

    - name: Create remote run workspace
      ansible.builtin.file:
        path: "{{ validation_remote_root }}"
        state: directory
        mode: "0750"

    - name: Create remote evidence workspace
      ansible.builtin.file:
        path: "{{ validation_remote_evidence_dir }}"
        state: directory
        mode: "0750"

    - name: smoke | compute_units | discovery
      shell: |
        lvs --noheadings -o lv_name | grep -Eq '^[[:space:]]*cu[0-9]+[[:space:]]*$'
      args:
        executable: /bin/bash
      register: smoke__compute_units__discovery
      changed_when: false
      failed_when: false
      when: validation_group in ['smoke', 'all']

    - name: smoke | cgroups | v2
      shell: |
        test -f /sys/fs/cgroup/cgroup.controllers && 
        grep -qw cpuset /sys/fs/cgroup/cgroup.controllers && 
        test -f /etc/systemd/system/user@.service.d/delegate.conf
      args:
        executable: /bin/bash
      register: smoke__cgroups__v2
      changed_when: false
      failed_when: false
      when: validation_group in ['smoke', 'all']

    - name: smoke | cpu | cpuset
      shell: |
        if compgen -G '/etc/systemd/system/user-*.slice.d/50-kloigos.conf' >/dev/null;
        then grep -Rqs '^AllowedCPUs=' /etc/systemd/system/user-*.slice.d/50-kloigos.conf;
        else printf '__KLOIGOS_SKIPPED__\n'; fi
      args:
        executable: /bin/bash
      register: smoke__cpu__cpuset
      changed_when: false
      failed_when: false
      when: validation_group in ['smoke', 'all']

    - name: smoke | systemd | manager
      shell: |
        systemctl show --property=Version --value
      args:
        executable: /bin/bash
      register: smoke__systemd__manager
      changed_when: false
      failed_when: false
      when: validation_group in ['smoke', 'all']

    - name: smoke | storage | compute_unit_mounts
      shell: |
        find /mnt/kloigos -mindepth 2 -maxdepth 2 -type d -name 'cu*' -print -quit | grep -q .
      args:
        executable: /bin/bash
      register: smoke__storage__compute_unit_mounts
      changed_when: false
      failed_when: false
      when: validation_group in ['smoke', 'all']

    - name: smoke | networking | floating_ips
      shell: |
        if compgen -G '/etc/kloigos/floating-ips.d/*.conf' >/dev/null;
        then grep -Rqs '^ip_address=' /etc/kloigos/floating-ips.d;
        else printf '__KLOIGOS_SKIPPED__\n'; fi
      args:
        executable: /bin/bash
      register: smoke__networking__floating_ips
      changed_when: false
      failed_when: false
      when: validation_group in ['smoke', 'all']

    - name: smoke | nftables | configuration
      shell: |
        test -f /etc/nftables.conf && 
        test -f /etc/nftables.d/kloigos-compute-units.nft && 
        nft list table inet kloigos_compute_units
      args:
        executable: /bin/bash
      register: smoke__nftables__configuration
      changed_when: false
      failed_when: false
      when: validation_group in ['smoke', 'all']

    - name: smoke | apparmor | profiles
      shell: |
        if compgen -G '/etc/apparmor.d/kloigos-*' >/dev/null;
        then aa-status --enabled;
        else printf '__KLOIGOS_SKIPPED__\n'; fi
      args:
        executable: /bin/bash
      register: smoke__apparmor__profiles
      changed_when: false
      failed_when: false
      when: validation_group in ['smoke', 'all']

    - name: smoke | resource_limits | nofile
      shell: |
        if compgen -G '/etc/systemd/system/user@*.service.d/50-kloigos.conf' >/dev/null;
        then grep -Rqs '^LimitNOFILE=[0-9]' /etc/systemd/system/user@*.service.d/50-kloigos.conf;
        else printf '__KLOIGOS_SKIPPED__\n'; fi
      args:
        executable: /bin/bash
      register: smoke__resource_limits__nofile
      changed_when: false
      failed_when: false
      when: validation_group in ['smoke', 'all']

    - name: Smoke | persist Compute Unit evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'smoke.compute-units.discovery', 'command': smoke__compute_units__discovery.cmd, 'stdout': smoke__compute_units__discovery.stdout, 'stderr': smoke__compute_units__discovery.stderr, 'rc': smoke__compute_units__discovery.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/smoke.compute-units.yaml"
        mode: "0640"
      when: validation_group in ['smoke', 'all']

    - name: Smoke | persist cgroup evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'smoke.cgroups.v2', 'command': smoke__cgroups__v2.cmd, 'stdout': smoke__cgroups__v2.stdout, 'stderr': smoke__cgroups__v2.stderr, 'rc': smoke__cgroups__v2.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/smoke.cgroups.yaml"
        mode: "0640"
      when: validation_group in ['smoke', 'all']

    - name: Smoke | persist CPU evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'smoke.cpu.cpuset', 'status': 'skipped', 'summary': 'No allocated-user slice overrides are present on this host.'} if smoke__cpu__cpuset.stdout == '__KLOIGOS_SKIPPED__' else {'id': 'smoke.cpu.cpuset', 'command': smoke__cpu__cpuset.cmd, 'stdout': smoke__cpu__cpuset.stdout, 'stderr': smoke__cpu__cpuset.stderr, 'rc': smoke__cpu__cpuset.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/smoke.cpu.yaml"
        mode: "0640"
      when: validation_group in ['smoke', 'all']

    - name: Smoke | persist systemd evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'smoke.systemd.manager', 'command': smoke__systemd__manager.cmd, 'stdout': smoke__systemd__manager.stdout, 'stderr': smoke__systemd__manager.stderr, 'rc': smoke__systemd__manager.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/smoke.systemd.yaml"
        mode: "0640"
      when: validation_group in ['smoke', 'all']

    - name: Smoke | persist storage evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'smoke.storage.compute-unit-mounts', 'command': smoke__storage__compute_unit_mounts.cmd, 'stdout': smoke__storage__compute_unit_mounts.stdout, 'stderr': smoke__storage__compute_unit_mounts.stderr, 'rc': smoke__storage__compute_unit_mounts.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/smoke.storage.yaml"
        mode: "0640"
      when: validation_group in ['smoke', 'all']

    - name: Smoke | persist networking evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'smoke.networking.floating-ips', 'status': 'skipped', 'summary': 'No Kloigos floating-IP configurations are present.'} if smoke__networking__floating_ips.stdout == '__KLOIGOS_SKIPPED__' else {'id': 'smoke.networking.floating-ips', 'command': smoke__networking__floating_ips.cmd, 'stdout': smoke__networking__floating_ips.stdout, 'stderr': smoke__networking__floating_ips.stderr, 'rc': smoke__networking__floating_ips.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/smoke.networking.yaml"
        mode: "0640"
      when: validation_group in ['smoke', 'all']

    - name: Smoke | persist nftables evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'smoke.nftables.configuration', 'command': smoke__nftables__configuration.cmd, 'stdout': smoke__nftables__configuration.stdout, 'stderr': smoke__nftables__configuration.stderr, 'rc': smoke__nftables__configuration.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/smoke.nftables.yaml"
        mode: "0640"
      when: validation_group in ['smoke', 'all']

    - name: Smoke | persist AppArmor evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'smoke.apparmor.profiles', 'status': 'skipped', 'summary': 'No Kloigos AppArmor profiles are present.'} if smoke__apparmor__profiles.stdout == '__KLOIGOS_SKIPPED__' else {'id': 'smoke.apparmor.profiles', 'command': smoke__apparmor__profiles.cmd, 'stdout': smoke__apparmor__profiles.stdout, 'stderr': smoke__apparmor__profiles.stderr, 'rc': smoke__apparmor__profiles.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/smoke.apparmor.yaml"
        mode: "0640"
      when: validation_group in ['smoke', 'all']

    - name: Smoke | persist resource-limit evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'smoke.resource-limits.nofile', 'status': 'skipped', 'summary': 'No allocation LimitNOFILE overrides are present.'} if smoke__resource_limits__nofile.stdout == '__KLOIGOS_SKIPPED__' else {'id': 'smoke.resource-limits.nofile', 'command': smoke__resource_limits__nofile.cmd, 'stdout': smoke__resource_limits__nofile.stdout, 'stderr': smoke__resource_limits__nofile.stderr, 'rc': smoke__resource_limits__nofile.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/smoke.resource-limits.yaml"
        mode: "0640"
      when: validation_group in ['smoke', 'all']

    - name: resources | cgroup | limits
      shell: |
        uid=$(id -u {{ validation_fixture.login_user | default('') | quote }}) &&
        cgroup=/sys/fs/cgroup/user.slice/user-${uid}.slice &&
        test -n "$(cat "$cgroup/cpuset.cpus.effective")" &&
        test -f "$cgroup/memory.max" &&
        test -f "$cgroup/pids.max"
      args:
        executable: /bin/bash
      register: resources__cgroup__limits
      changed_when: false
      failed_when: false
      when: validation_group in ['resources', 'all']

    - name: resources | memory | limit
      shell: |
        uid=$(id -u {{ validation_fixture.login_user | default('') | quote }}) &&
        limit=$(cat "/sys/fs/cgroup/user.slice/user-${uid}.slice/memory.max") &&
        printf 'memory.max=%s\n' "$limit" && test "$limit" != max
      args:
        executable: /bin/bash
      register: resources__memory__limit
      changed_when: false
      failed_when: false
      when: validation_group in ['resources', 'all']

    - name: resources | pids | limit
      shell: |
        uid=$(id -u {{ validation_fixture.login_user | default('') | quote }}) &&
        limit=$(cat "/sys/fs/cgroup/user.slice/user-${uid}.slice/pids.max") &&
        printf 'pids.max=%s\n' "$limit" && test "$limit" != max
      args:
        executable: /bin/bash
      register: resources__pids__limit
      changed_when: false
      failed_when: false
      when: validation_group in ['resources', 'all']

    - name: network | floating_ip | presence
      shell: |
        ip addr show to {{ validation_fixture.ip_address | default('') | quote }}
      args:
        executable: /bin/bash
      register: network__floating_ip__presence
      changed_when: false
      failed_when: false
      when: validation_group in ['network', 'all']

    - name: network | nftables | table_active
      shell: |
        nft list table inet kloigos_compute_units
      args:
        executable: /bin/bash
      register: network__nftables__table_active
      changed_when: false
      failed_when: false
      when: validation_group in ['network', 'all']

    - name: Network | persist floating-IP evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'network.floating-ip.presence', 'command': network__floating_ip__presence.cmd,
          'stdout': network__floating_ip__presence.stdout, 'stderr': network__floating_ip__presence.stderr,
          'rc': network__floating_ip__presence.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/network.floating-ip.yaml"
        mode: "0640"
      when: validation_group in ['network', 'all']

    - name: Network | persist nftables evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'network.nftables.table-active', 'command': network__nftables__table_active.cmd,
          'stdout': network__nftables__table_active.stdout, 'stderr': network__nftables__table_active.stderr,
          'rc': network__nftables__table_active.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/network.nftables.yaml"
        mode: "0640"
      when: validation_group in ['network', 'all']

    - name: resources | cgroup | hierarchy
      shell: |
        uid=$(id -u {{ validation_fixture.login_user | default('') | quote }}) &&
        test -d "/sys/fs/cgroup/user.slice/user-${uid}.slice"
      args:
        executable: /bin/bash
      register: resources__cgroup__hierarchy
      changed_when: false
      failed_when: false
      when: validation_group in ['resources', 'all']

    - name: resources | cpu_affinity | positive
      shell: |
        uid=$(id -u {{ validation_fixture.login_user | default('') | quote }}) &&
        cgroup=/sys/fs/cgroup/user.slice/user-${uid}.slice &&
        allowed=$(cat "$cgroup/cpuset.cpus.effective") &&
        actual=$(systemd-run --quiet --pipe --wait --collect --uid {{ validation_fixture.login_user | default('') | quote }} --slice=user-${uid}.slice /bin/sh -c 'awk "/Cpus_allowed_list/ {print \$2}" /proc/self/status') &&
        test "$actual" = "$allowed"
      args:
        executable: /bin/bash
      register: resources__cpu_affinity__positive
      changed_when: false
      failed_when: false
      when: validation_group in ['resources', 'all']

    - name: resources | cpu_affinity | escape
      shell: |
        uid=$(id -u {{ validation_fixture.login_user | default('') | quote }}) &&
        allowed=$(cat "/sys/fs/cgroup/user.slice/user-${uid}.slice/cpuset.cpus.effective") &&
        outside=$(python3 -c 'import os,sys; allowed=set(); [allowed.update(range(int(x.split("-")[0]), int(x.split("-")[-1])+1)) for x in sys.argv[1].split(",") if x]; print(next((cpu for cpu in range(os.cpu_count() or 0) if cpu not in allowed), ""))' "$allowed") &&
        test -n "$outside" && systemd-run --quiet --pipe --wait --collect --uid {{ validation_fixture.login_user | default('') | quote }} --slice=user-${uid}.slice taskset -c "$outside" /bin/true
      args:
        executable: /bin/bash
      register: resources__cpu_affinity__escape
      changed_when: false
      failed_when: false
      when: validation_group in ['resources', 'all']

    - name: resources | memory | enforcement
      shell: |
        uid=$(id -u {{ validation_fixture.login_user | default('') | quote }}) &&
        systemd-run --quiet --pipe --wait --collect \
          --uid {{ validation_fixture.login_user | default('') | quote }} \
          --slice=user-${uid}.slice \
          --property=MemoryMax=32M \
          /usr/bin/timeout --kill-after=5s 15s python3 -c '
        import sys
        value = bytearray(64 * 1024 * 1024)
        print(f"unexpectedly allocated {len(value)} bytes")
        sys.exit(0)
        '
      args:
        executable: /bin/bash
      register: resources__memory__enforcement
      changed_when: false
      failed_when: false
      when: validation_group in ['resources', 'all']

    - name: resources | pids | enforcement
      shell: |
        uid=$(id -u {{ validation_fixture.login_user | default('') | quote }}) &&
        systemd-run --quiet --pipe --wait --collect \
          --uid {{ validation_fixture.login_user | default('') | quote }} \
          --slice=user-${uid}.slice \
          --property=TasksMax=32 \
          /usr/bin/timeout --kill-after=5s 15s python3 -c '
        import errno
        import os
        import signal
        import sys

        children = []
        try:
            for _ in range(64):
                try:
                    pid = os.fork()
                except OSError as exc:
                    if exc.errno == errno.EAGAIN:
                        print("pids.max denied an additional process")
                        sys.exit(1)
                    raise
                if pid == 0:
                    signal.pause()
                    os._exit(0)
                children.append(pid)
            print("unexpectedly created all requested processes")
            sys.exit(0)
        finally:
            for pid in children:
                try:
                    os.kill(pid, signal.SIGTERM)
                except ProcessLookupError:
                    pass
            for pid in children:
                try:
                    os.waitpid(pid, 0)
                except ChildProcessError:
                    pass
        '
      args:
        executable: /bin/bash
      register: resources__pids__enforcement
      changed_when: false
      failed_when: false
      when: validation_group in ['resources', 'all']

    - name: resources | systemd | overrides
      shell: |
        find /etc/systemd/system -path '*/50-kloigos.conf' -print -quit | grep -q .
      args:
        executable: /bin/bash
      register: resources__systemd__overrides
      changed_when: false
      failed_when: false
      when: validation_group in ['resources', 'all']

    - name: Resources | persist cgroup evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'resources.cgroup.hierarchy', 'command': resources__cgroup__hierarchy.cmd,
          'stdout': resources__cgroup__hierarchy.stdout, 'stderr': resources__cgroup__hierarchy.stderr,
          'rc': resources__cgroup__hierarchy.rc},
          {'id': 'resources.cgroup.limits', 'command': resources__cgroup__limits.cmd,
          'stdout': resources__cgroup__limits.stdout, 'stderr': resources__cgroup__limits.stderr,
          'rc': resources__cgroup__limits.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/resources.cgroup.yaml"
        mode: "0640"
      when: validation_group in ['resources', 'all']

    - name: Resources | persist memory evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'resources.memory.limit', 'command': resources__memory__limit.cmd, 'stdout': resources__memory__limit.stdout, 'stderr': resources__memory__limit.stderr, 'rc': resources__memory__limit.rc},
          {'id': 'resources.memory.enforcement', 'command': resources__memory__enforcement.cmd, 'stdout': resources__memory__enforcement.stdout, 'stderr': resources__memory__enforcement.stderr, 'rc': resources__memory__enforcement.rc, 'expect_failure': true}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/resources.memory.yaml"
        mode: "0640"
      when: validation_group in ['resources', 'all']

    - name: Resources | persist PID evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'resources.pids.limit', 'command': resources__pids__limit.cmd, 'stdout': resources__pids__limit.stdout, 'stderr': resources__pids__limit.stderr, 'rc': resources__pids__limit.rc},
          {'id': 'resources.pids.enforcement', 'command': resources__pids__enforcement.cmd, 'stdout': resources__pids__enforcement.stdout, 'stderr': resources__pids__enforcement.stderr, 'rc': resources__pids__enforcement.rc, 'expect_failure': true}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/resources.pids.yaml"
        mode: "0640"
      when: validation_group in ['resources', 'all']

    - name: Resources | persist CPU-affinity evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'resources.cpu-affinity.positive', 'command': resources__cpu_affinity__positive.cmd, 'stdout': resources__cpu_affinity__positive.stdout, 'stderr': resources__cpu_affinity__positive.stderr, 'rc': resources__cpu_affinity__positive.rc},
          {'id': 'resources.cpu-affinity.escape', 'command': resources__cpu_affinity__escape.cmd, 'stdout': resources__cpu_affinity__escape.stdout, 'stderr': resources__cpu_affinity__escape.stderr, 'rc': resources__cpu_affinity__escape.rc, 'expect_failure': true}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/resources.cpu-affinity.yaml"
        mode: "0640"
      when: validation_group in ['resources', 'all']

    - name: Resources | persist systemd evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'resources.systemd.overrides', 'command': resources__systemd__overrides.cmd, 'stdout': resources__systemd__overrides.stdout, 'stderr': resources__systemd__overrides.stderr, 'rc': resources__systemd__overrides.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/resources.systemd.yaml"
        mode: "0640"
      when: validation_group in ['resources', 'all']

    - name: workloads | fixture | user_exists
      shell: |
        id -u {{ validation_fixture.login_user | default('') | quote }}
      args:
        executable: /bin/bash
      register: workloads__fixture__user_exists
      changed_when: false
      failed_when: false
      when: validation_group in ['workloads', 'all']

    - name: workloads | resource_load | bounded_execution
      shell: |
        uid=$(id -u {{ validation_fixture.login_user | default('') | quote }}) &&
        systemd-run --quiet --pipe --wait --collect --uid {{ validation_fixture.login_user | default('') | quote }} --slice=user-${uid}.slice stress-ng --cpu 1 --vm 1 --vm-bytes 64M --fork 1 --hdd 1 --hdd-bytes 16M --timeout 15s --temp-path /tmp --metrics-brief
      args:
        executable: /bin/bash
      register: workloads__resource_load__bounded_execution
      changed_when: false
      failed_when: false
      when: validation_group in ['workloads', 'all'] and workloads__fixture__user_exists.rc == 0

    - name: workloads | filesystem | disk_io_correctness
      shell: |
        uid=$(id -u {{ validation_fixture.login_user | default('') | quote }}) &&
        home=$(getent passwd {{ validation_fixture.login_user | default('') | quote }} | cut -d: -f6) &&
        systemd-run --quiet --pipe --wait --collect --uid {{ validation_fixture.login_user | default('') | quote }} --slice=user-${uid}.slice /bin/sh -c '
          fio --name=kloigos-validation --filename="$1/.kloigos-validation-fio.bin" --size=16M --rw=readwrite --bs=1M --direct=0 --verify=crc32c --do_verify=1 --output-format=json
          rc=$?
          rm -f "$1/.kloigos-validation-fio.bin"
          exit $rc
        ' sh "$home"
      args:
        executable: /bin/bash
      register: workloads__filesystem__disk_io_correctness
      changed_when: false
      failed_when: false
      when: validation_group in ['workloads', 'all']

    - name: workloads | host | responsiveness
      shell: |
        systemctl is-system-running
      args:
        executable: /bin/bash
      register: workloads__host__responsiveness
      changed_when: false
      failed_when: false
      when: validation_group in ['workloads', 'all']

    - name: Workloads | persist fixture evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'workloads.fixture.user-exists', 'command': workloads__fixture__user_exists.cmd, 'stdout': workloads__fixture__user_exists.stdout, 'stderr': workloads__fixture__user_exists.stderr, 'rc': workloads__fixture__user_exists.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/workloads.fixture.yaml"
        mode: "0640"
      when: validation_group in ['workloads', 'all']

    - name: Workloads | persist resource-load evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'workloads.resource-load.bounded-execution', 'command': workloads__resource_load__bounded_execution.cmd | default('not run'), 'stdout': workloads__resource_load__bounded_execution.stdout | default(''), 'stderr': workloads__resource_load__bounded_execution.stderr | default('fixture user is unavailable'), 'rc': workloads__resource_load__bounded_execution.rc | default(1)}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/workloads.resource-load.yaml"
        mode: "0640"
      when: validation_group in ['workloads', 'all']

    - name: Workloads | persist filesystem evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'workloads.filesystem.disk-io-correctness', 'command': workloads__filesystem__disk_io_correctness.cmd, 'stdout': workloads__filesystem__disk_io_correctness.stdout, 'stderr': workloads__filesystem__disk_io_correctness.stderr, 'rc': workloads__filesystem__disk_io_correctness.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/workloads.filesystem.yaml"
        mode: "0640"
      when: validation_group in ['workloads', 'all']

    - name: Workloads | persist host evidence
      ansible.builtin.copy:
        content: >-
          {{ [
          {'id': 'workloads.host.responsiveness', 'command': workloads__host__responsiveness.cmd, 'stdout': workloads__host__responsiveness.stdout, 'stderr': workloads__host__responsiveness.stderr, 'rc': workloads__host__responsiveness.rc}
          ] | to_nice_yaml }}
        dest: "{{ validation_remote_evidence_dir }}/workloads.host.yaml"
        mode: "0640"
      when: validation_group in ['workloads', 'all']

    - name: Archive collected validation data
      shell: |
        tar -C {{ validation_remote_root | quote }} -czf {{ validation_remote_bundle | quote }} .
      args:
        executable: /bin/bash
      changed_when: false

    - name: Fetch collected validation bundle
      ansible.builtin.fetch:
        src: "{{ validation_remote_bundle }}"
        dest: "{{ validation_controller_report_dir }}/{{ inventory_hostname }}-{{ validation_run_id }}.tar.gz"
        flat: true

    - name: Remove remote validation workspace and bundle after fetch
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ validation_remote_root }}"
        - "{{ validation_remote_bundle }}"
