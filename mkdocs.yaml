site_name: kloigos
site_description: A Linux-native platform for managing isolated workloads on bare-metal infrastructure.
repo_name: fabiog1901/kloigos
repo_url: https://github.com/fabiog1901/kloigos

plugins:
  - search

markdown_extensions:
  - attr_list
  - mkdocs-click
  - admonition
  - pymdownx.details
  - pymdownx.superfences


theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  logo: assets/favicon.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/lightbulb-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: cyan
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: cyan 
      toggle:
        icon: material/lightbulb-outline
        name: Switch to system preference
  features:
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    # - navigation.instant.preview
    - navigation.instant.progress
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/fabiog1901/kloigos
  - icon: fontawesome/solid/comments
    link: https://github.com/fabiog1901/kloigos/discussions

nav:
  - Home: index.md
  - Product positioning: product-positioning.md
  - Docs:
    - Getting started: docs/getting-started.md
    - SSH keys: docs/ssh-keys.md
    - Server preparation: docs/server-preparation.md
    - Authentication: docs/auth.md
    - Deployment: docs/deployment.md
    - Playbooks: docs/playbooks.md
    - Architecture: docs/architecture.md
  - Reference:
    - Product context:
      - Overview: product_context_snapshots/README.md
      - 2026-10-03 snapshot: product_context_snapshots/2026-10-03.md
      - 2026-09-14 snapshot: product_context_snapshots/2026-09-14.md
    - Design:
      - Overview: design/README.md
      - Architecture overview: design/Architecture_Overview.md
      - Compute Unit and allocation model: design/Compute_Unit_and_Allocation_Model.md
      - Host Families: design/Host_Families.md
      - Instance Classes: design/Instance_Classes.md
      - CPU Policy model: design/CPU_Policy_Model.md
      - Logical CPU Manager: design/Logical_CPU_Manager.md
      - Shared and Burstable CPU: design/Shared_and_Burstable_CPU.md
      - Dynamic Compute Unit Allocator: design/Dynamic_Compute_Unit_Allocator.md
      - Dynamic Compute Unit Provisioner: design/Dynamic_Compute_Unit_Provisioner.md
      - CPU resource model: design/CPU_Resource_Model.md
      - Scheduling and placement model: design/Scheduling_and_Placement_Model.md
      - Networking and IP model: design/Networking_and_IP_Model.md
      - Security and isolation model: design/Security_and_Isolation_Model.md
      - Storage and persistence model: design/Storage_and_Persistence_Model.md
      - Tenancy model: design/Tenancy_Model.md
  - About: about.md

extra_css:
  - css/extra.css
